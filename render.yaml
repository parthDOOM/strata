services:
  # Backend Service (Docker)
  - type: web
    name: quant-backend
    env: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: API_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/quant.db
    healthCheckPath: /health
    # Run seed script before starting the server to ensure data exists
    startCommand: python -m scripts.seed_market_data && uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: free

  # Frontend Service (Static Site)
  - type: web
    name: quant-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quant-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html