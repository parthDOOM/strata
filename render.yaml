services:
  # Backend Service (Docker)
  - type: web
    name: quant-backend
    env: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: API_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/quant.db
    healthCheckPath: /api/v1/health
    plan: free

  # Frontend Service (Static Site)
  - type: web
    name: quant-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quant-backend
          property: url