services:
  # Backend Service (Docker)
  - type: web
    name: quant-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: API_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/quant.db
    healthCheckPath: /api/v1/health
    plan: free

  # Frontend Service (Static Site)
  - type: static
    name: quant-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quant-backend
          property: url
