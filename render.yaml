services:
  # Backend Service (Docker)
  - type: web
    name: quant-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: API_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/quant.db
    healthCheckPath: /api/v1/health
    plan: free

  # Frontend Service (Static Site)
  - type: static_site
    name: quant-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quant-backend
          property: url